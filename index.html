<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>KSU Coffee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4a2c2a;
        }
        .student-id {
            color: #666;
            font-size: 14px;
        }
        .menu-list {
            max-width: 400px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .version {
            margin-top: 15px;
            font-weight: bold;
            color: #2e7d32;
        }
        .promo-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>ร้าน KSU Coffee</h1>
    <p class="student-id">รหัสนักศึกษา: 671540005015-6</p>

    <div class="menu-list">
        <h2>รายการเมนู</h2>
        <div class="menu-item"><span>Espresso</span> <span>50 บาท</span></div>
        <div class="menu-item"><span>Americano</span> <span>55 บาท</span></div>
        <div class="menu-item"><span>Latte</span> <span>60 บาท</span></div>
        <div class="menu-item"><span>Cappuccino</span> <span>65 บาท</span></div>
        <div class="version">Menu v2</div>

        <a href="http://localhost:8081" class="promo-btn">ดูโปรโมชั่น</a>
    </div>
</body>
</html>
